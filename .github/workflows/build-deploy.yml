name: 🏗️ Build & Push Nuxt output

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install deps
        run: npm ci

      - name: 🏗️ Build (Nitro)
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
          # ajoute ici toute autre variable NUXT_PUBLIC_* nécessaire au build

      - name: 📤 Push .output vers la branche deploy
        run: |
          cd .output
          git init
          git checkout -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: build $(date +%Y%m%d-%H%M%S)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Public-Projet/fret.git" deploy:deploy